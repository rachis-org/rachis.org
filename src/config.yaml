site:
  name: Rachis
  site: 'https://rachis.org'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: Rachis — A shared foundation for scientific software
    template: '%s'
  description: 'Build scientific plugins and distributions with automatic provenance, typed data, and automatically generated interfaces. Rachis is the open-source framework behind QIIME 2 and MOSHPIT.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Rachis
    images:
      - url: '~/assets/images/rachis-social.png'
        width: 1200
        height: 630
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    # Discourse posts are loaded only when DISCOURSE_API_KEY is set at build time.
    isEnabled: true
    postsPerPage: 12

    post:
      isEnabled: true
      permalink: '/news/%slug%-%id%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: '/news' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: false
      pathname: '/news/category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: false

    tag:
      isEnabled: true
      pathname: '/news/tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
